<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Ace Slot</title>
<style>
  body {
    background: radial-gradient(circle, #111 40%, #000);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    color: gold;
    font-family: Arial, sans-serif;
  }

  .multipliers {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: bold;
  }
  .active {
    color: #ffdf00;
    text-shadow: 0 0 10px gold;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 100px); /* narrower cards */
    grid-template-rows: repeat(3, 140px);
    gap: 2px; /* very small gap so cards are close */
    justify-content: center;
  }
  .cell {
    border: 2px solid gold;
    border-radius: 6px;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .cell img {
    width: 100%;
    height: auto;
    transform: translateY(-200%);
    transition: transform 0.6s ease-out;
  }

  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    background: gold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="multipliers">
    <span id="x1" class="active">x1</span>
    <span id="x2">x2</span>
    <span id="x3">x3</span>
    <span id="x5">x5</span>
  </div>

  <div class="grid" id="slotGrid">
    <!-- 15 cells (5x3 grid) -->
    <div class="cell"><img src="ace.png" alt="Ace"></div>
    <div class="cell"><img src="king.png" alt="King"></div>
    <div class="cell"><img src="queen.png" alt="Queen"></div>
    <div class="cell"><img src="jack.png" alt="Jack"></div>
    <div class="cell"><img src="ten.png" alt="Ten"></div>
    <div class="cell"><img src="ace.png" alt="Ace"></div>
    <div class="cell"><img src="king.png" alt="King"></div>
    <div class="cell"><img src="queen.png" alt="Queen"></div>
    <div class="cell"><img src="jack.png" alt="Jack"></div>
    <div class="cell"><img src="ten.png" alt="Ten"></div>
    <div class="cell"><img src="ace.png" alt="Ace"></div>
    <div class="cell"><img src="king.png" alt="King"></div>
    <div class="cell"><img src="queen.png" alt="Queen"></div>
    <div class="cell"><img src="jack.png" alt="Jack"></div>
    <div class="cell"><img src="ten.png" alt="Ten"></div>
  </div>

  <button id="spin">SPIN</button>

<script>
const cards = ["ace.png", "king.png", "queen.png", "jack.png", "ten.png"];
const cells = document.querySelectorAll('.cell img');
const multipliers = ["x1", "x2", "x3", "x5"];
let currentMultiplier = 0;

function spinGrid() {
  cells.forEach((img, i) => {
    img.style.transform = 'translateY(-200%)';
    setTimeout(() => {
      const randomCard = cards[Math.floor(Math.random() * cards.length)];
      img.src = randomCard;
      img.style.transform = 'translateY(0)';
    }, 300 + i * 50);
  });

  // Animate multiplier
  document.querySelectorAll('.multipliers span').forEach(el => el.classList.remove('active'));
  currentMultiplier = (currentMultiplier + 1) % multipliers.length;
  document.getElementById(multipliers[currentMultiplier]).classList.add('active');
}

document.getElementById('spin').addEventListener('click', spinGrid);
</script>
</body>
</html>
