<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Ace</title>
  <style>
    body { background:#111; color:white; text-align:center; font-family:Arial; }
    h1 { color:gold; margin-top:20px; }
    .reels { display:flex; justify-content:center; margin:20px; }
    .reel {
      background:#222; width:100px; height:100px; margin:10px;
      display:flex; align-items:center; justify-content:center;
      border-radius:10px;
      transition: transform 0.3s;
    }
    .reel img { width:80px; height:80px; }
    button {
      padding:10px 20px;
      background:#ff004f;
      border:none;
      border-radius:5px;
      color:white;
      font-weight:bold;
      cursor:pointer;
      margin:10px;
    }
    #result { margin-top:20px; font-size:18px; }
  </style>
</head>
<body>
  <h1>♠ Super Ace ♠</h1>
  <div class="reels">
    <div class="reel" id="r1"><img src="ace.png" alt="Ace"></div>
    <div class="reel" id="r2"><img src="king.png" alt="King"></div>
    <div class="reel" id="r3"><img src="queen.png" alt="Queen"></div>
  </div>
  <button onclick="spin()">SPIN</button>
  <button onclick="goBack()">⬅ Back to Dashboard</button>
  <p id="result"></p>

  <script>
    // Symbol set with image paths
    const symbols = [
      {name:"A", img:"ace.png"},
      {name:"K", img:"king.png"},
      {name:"Q", img:"queen.png"},
      {name:"J", img:"jack.png"},
      {name:"10", img:"ten.png"},
      {name:"⭐", img:"scatter.png"}
    ];
    let freeSpins = 0;

    function spin() {
      if(freeSpins > 0){
        freeSpins--;
        runSpin(true);
      } else {
        runSpin(false);
      }
    }

    function runSpin(isFree){
      let r1 = symbols[Math.floor(Math.random()*symbols.length)];
      let r2 = symbols[Math.floor(Math.random()*symbols.length)];
      let r3 = symbols[Math.floor(Math.random()*symbols.length)];

      // Animate reels
      document.getElementById("r1").style.transform = "rotateX(360deg)";
      document.getElementById("r2").style.transform = "rotateX(360deg)";
      document.getElementById("r3").style.transform = "rotateX(360deg)";
      setTimeout(() => {
        document.getElementById("r1").innerHTML = `<img src="${r1.img}" alt="${r1.name}">`;
        document.getElementById("r2").innerHTML = `<img src="${r2.img}" alt="${r2.name}">`;
        document.getElementById("r3").innerHTML = `<img src="${r3.img}" alt="${r3.name}">`;
        document.getElementById("r1").style.transform = "";
        document.getElementById("r2").style.transform = "";
        document.getElementById("r3").style.transform = "";
      }, 300);

      // Check results
      let reels = [r1.name, r2.name, r3.name];
      let aceCount = reels.filter(r => r === "A").length;
      let scatterCount = reels.filter(r => r === "⭐").length;

      if(scatterCount >= 2){
        freeSpins += 2;
        document.getElementById("result").innerText = "✨ Scatter Bonus! You earned 2 Free Spins!";
        setTimeout(spin, 1500);
      } else if(aceCount === 3){
        document.getElementById("result").innerText = "🎉 JACKPOT! Triple Aces!";
      } else if(aceCount === 2){
        document.getElementById("result").innerText = "✨ Small Win! Double Aces!";
      } else {
        document.getElementById("result").innerText = isFree ? "Free Spin used!" : "Try again!";
      }
    }

    function goBack(){
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
