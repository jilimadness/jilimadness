<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Ace Slot</title>
<style>
  body {
    background: radial-gradient(circle, #111 40%, #000);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    color: gold;
    font-family: Arial, sans-serif;
  }

  .multipliers {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: bold;
  }

  .active {
    color: #ffdf00;
    text-shadow: 0 0 10px gold;
  }

  .slot {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .reel {
    width: 120px;
    height: 160px;
    border: 3px solid gold;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }

  .reel img {
    width: 100%;
    position: absolute;
    top: 0;
    transition: top 0.3s ease-out;
  }

  button {
    margin-top: 40px;
    padding: 10px 20px;
    font-size: 18px;
    background: gold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="multipliers">
    <span id="x1" class="active">x1</span>
    <span id="x2">x2</span>
    <span id="x3">x3</span>
    <span id="x5">x5</span>
  </div>

  <div class="slot">
    <div class="reel"><img src="ace.png" alt="Ace"></div>
    <div class="reel"><img src="king.png" alt="King"></div>
    <div class="reel"><img src="queen.png" alt="Queen"></div>
    <div class="reel"><img src="jack.png" alt="Jack"></div>
    <div class="reel"><img src="ten.png" alt="Ten"></div>
  </div>

  <button id="spin">SPIN</button>

<script>
const cards = ["ace.png", "king.png", "queen.png", "jack.png", "ten.png"];
const reels = document.querySelectorAll('.reel img');
const multipliers = ["x1", "x2", "x3", "x5"];
let currentMultiplier = 0;

function spinReels() {
  reels.forEach((img, i) => {
    img.style.top = '-400px';
    setTimeout(() => {
      const randomCard = cards[Math.floor(Math.random() * cards.length)];
      img.src = randomCard;
      img.style.top = '0';
    }, 500 + i * 200);
  });

  // Animate multiplier
  document.querySelectorAll('.multipliers span').forEach(el => el.classList.remove('active'));
  currentMultiplier = (currentMultiplier + 1) % multipliers.length;
  document.getElementById(multipliers[currentMultiplier]).classList.add('active');
}

document.getElementById('spin').addEventListener('click', spinReels);
</script>
</body>
</html>
