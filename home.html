<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JiliMadness - Home</title>
  <style>
    body { background:#111; color:white; text-align:center; font-family:Arial; }
    #popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
             background:rgba(0,0,0,0.95); color:white; padding:20px; z-index:9999; }
    #popup h2 { color:gold; text-align:center; }
    #popup button { margin:10px; padding:10px 20px; background:#ff004f; border:none;
                    border-radius:5px; color:white; font-weight:bold; cursor:pointer; }
    #recaptcha-container { margin-top:20px; text-align:center; }
  </style>
</head>
<body onload="showPopup()">
  <h1>Welcome to JiliMadness</h1>
  <p>Your dashboard starts here</p>

  <div id="popup">
    <h2>Responsible Gaming Guidelines</h2>
    <p>• I am over 21 years of age.</p>
    <p>• I am not a government official or Armed Forces member.</p>
    <p>• I am not a holder of a Gaming Employment License (GEL).</p>
    <p>• Playing in open and public places is prohibited.</p>
    <div class="buttons">
      <button onclick="exitToIndex()">EXIT</button>
      <button onclick="proceed()">PROCEED</button>
    </div>
    <div id="recaptcha-container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLAo7rx11yfA6GAdWoXhwrd3hedcZXuBc",
      authDomain: "jilimadness.firebaseapp.com",
      projectId: "jilimadness",
      storageBucket: "jilimadness.firebasestorage.app",
      messagingSenderId: "150215292013",
      appId: "1:150215292013:web:d840af710a67776b8bbb64",
      measurementId: "G-WCZ8NS8CVT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showPopup() {
      document.getElementById("popup").style.display = "block";
    }
    function exitToIndex() {
      window.location.href = "index.html";
    }

    window.proceed = function() {
      let phone = localStorage.getItem("userPhone");
      if (!phone) {
        alert("No phone number found. Please sign up again.");
        window.location.href = "index.html";
        return;
      }

      // Convert internally for Firebase
      const firebasePhone = "+63" + phone.substring(1);

      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
      const appVerifier = window.recaptchaVerifier;

      signInWithPhoneNumber(auth, firebasePhone, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          alert("OTP sent to " + phone);
          window.location.href = "otp.html";
        })
        .catch((error) => {
          console.error("SMS not sent", error);
          alert("Error sending OTP: " + error.message);
        });
    }
  </script>
</body>
</html>
