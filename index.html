<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JiliMadness</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #3a0ca3, #7209b7, #f72585);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      overflow: hidden; /* keep particles inside */
    }

    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    header {
      padding: 30px;
      background: rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2.5em;
      margin: 0;
      color: gold;
      text-shadow: 0 0 10px gold;
    }
    .signup-box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin: 30px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #ff004f;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      box-shadow: 0 0 15px #ff004f;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff66a3;
    }
    #userList {
      margin-top: 20px;
      list-style: none;
      padding: 0;
    }
    #userList li {
      background: rgba(255,255,255,0.1);
      margin: 5px auto;
      padding: 10px;
      width: 250px;
      border-radius: 5px;
    }

    /* Particle canvas covers background */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <header>
    <h1>JiliMadness</h1>
    <p>Play Anytime, Anywhere — Earn Points!</p>
  </header>

  <div class="signup-box">
    <h2>Sign Up Now</h2>
    <input type="text" id="username" placeholder="Enter your name">
    <input type="text" id="phone" placeholder="+63 09XX XXX XXXX">
    <br>
    <button id="signupBtn">Sign Up</button>
    <p><input type="checkbox"> I Agree To Terms & Privacy</p>
  </div>

  <h2>Registered Users</h2>
  <ul id="userList"></ul>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLAo7rx11yfA6GAdWoXhwrd3hedcZXuBc",
      authDomain: "jilimadness.firebaseapp.com",
      projectId: "jilimadness",
      storageBucket: "jilimadness.firebasestorage.app",
      messagingSenderId: "150215292013",
      appId: "1:150215292013:web:d840af710a67776b8bbb64",
      measurementId: "G-WCZ8NS8CVT"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const name = document.getElementById("username").value;
      const phone = document.getElementById("phone").value;

      if (name && phone) {
        try {
          await addDoc(collection(db, "users"), {
            name: name,
            phone: phone,
            points: 0
          });
          alert("Signup successful! Data saved to Firebase.");
          loadUsers();
        } catch (error) {
          console.error("Error saving data: ", error);
          alert("Error saving data. Check console.");
        }
      } else {
        alert("Please enter both name and phone.");
      }
    });

    async function loadUsers() {
      const list = document.getElementById("userList");
      list.innerHTML = "";
      const snapshot = await getDocs(collection(db, "users"));
      snapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = `${data.name} - ${data.phone} - Points: ${data.points}`;
        list.appendChild(li);
      });
    }

    loadUsers();
  </script>

  <!-- Particles.js for sparkles -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {"value": 80},
        "color": {"value": "#ffffff"},
        "shape": {"type": "circle"},
        "opacity": {"value": 0.5},
        "size": {"value": 3},
        "move": {"speed": 2}
      },
      "interactivity": {
        "events": {
          "onhover": {"enable": true, "mode": "repulse"}
        }
      }
    });
  </script>
</body>
</html>
