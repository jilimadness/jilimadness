<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Ace</title>
  <style>
    body { background:#111; color:white; font-family:Arial; text-align:center; margin:0; }
    h1 { color:gold; margin:10px; }

    /* Multiplier bar */
    .multipliers {
      display:flex; justify-content:center; gap:15px;
      margin:10px; font-size:18px; color:gold;
    }

    /* Reel grid */
    .grid {
      display:grid;
      grid-template-columns: repeat(5, 100px);
      grid-template-rows: repeat(3, 100px);
      gap:10px;
      justify-content:center;
      margin:20px auto;
    }
    .cell {
      background:#222;
      border-radius:10px;
      display:flex; align-items:center; justify-content:center;
    }
    .cell img { width:80px; height:80px; }

    /* Controls */
    .controls {
      margin:20px;
    }
    button {
      padding:10px 20px;
      background:#ff004f;
      border:none;
      border-radius:5px;
      color:white;
      font-weight:bold;
      cursor:pointer;
      margin:5px;
    }
    #result { margin-top:15px; font-size:16px; }
  </style>
</head>
<body>
  <h1>♠ Super Ace ♠</h1>

  <!-- Multiplier bar -->
  <div class="multipliers">
    <div>x1</div>
    <div>x2</div>
    <div>x3</div>
    <div>x5</div>
  </div>

  <!-- Reel grid -->
  <div class="grid" id="grid">
    <!-- 15 cells (5x3) -->
    <!-- Filled dynamically -->
  </div>

  <!-- Controls -->
  <div class="controls">
    <button onclick="spin()">SPIN</button>
    <button onclick="autoSpin()">AUTOSPIN</button>
    <button onclick="goBack()">⬅ Back to Dashboard</button>
    <p id="result"></p>
  </div>

  <script>
    // Symbol set with images
    const symbols = [
      {name:"A", img:"ace.png"},
      {name:"K", img:"king.png"},
      {name:"Q", img:"queen.png"},
      {name:"J", img:"jack.png"},
      {name:"10", img:"ten.png"},
      {name:"Scatter", img:"scatter.png"}
    ];

    let autoSpinActive = false;

    // Initialize grid
    function initGrid(){
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for(let i=0;i<15;i++){
        let cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<img src="${symbols[0].img}" alt="${symbols[0].name}">`;
        grid.appendChild(cell);
      }
    }

    // Spin function
    function spin(){
      const grid = document.getElementById("grid").children;
      let scatterCount = 0;
      let aceCount = 0;

      for(let i=0;i<grid.length;i++){
        let sym = symbols[Math.floor(Math.random()*symbols.length)];
        grid[i].innerHTML = `<img src="${sym.img}" alt="${sym.name}">`;
        if(sym.name === "Scatter") scatterCount++;
        if(sym.name === "A") aceCount++;
      }

      if(scatterCount >= 3){
        document.getElementById("result").innerText = "✨ Scatter Bonus! Free Spins!";
      } else if(aceCount >= 5){
        document.getElementById("result").innerText = "🎉 JACKPOT! Multiple Aces!";
      } else {
        document.getElementById("result").innerText = "Try again!";
      }

      if(autoSpinActive){
        setTimeout(spin, 1500);
      }
    }

    function autoSpin(){
      autoSpinActive = !autoSpinActive;
      if(autoSpinActive){
        spin();
      }
    }

    function goBack(){
      window.location.href = "dashboard.html";
    }

    initGrid();
  </script>
</body>
</html>
