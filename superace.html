<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Ace</title>
  <style>
    body { background:#000; color:white; font-family:Arial; text-align:center; margin:0; }
    h1 { color:gold; margin:10px; font-size:22px; }

    /* Multiplier bar */
    .multipliers {
      display:flex; justify-content:space-around;
      margin:10px; font-size:16px; color:gold;
    }

    /* Reel grid */
    .grid {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 90px);
      gap:6px;
      margin:10px auto;
      max-width:95%;
    }
    .cell {
      background:#111;
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 5px #333 inset;
    }
    .cell img { width:70px; height:70px; }

    /* Balance + bet */
    #balance { font-size:16px; margin:10px; color:lightgreen; }
    #bet { font-size:16px; margin:10px; color:cyan; }

    /* Controls */
    .controls { margin:15px; }
    button {
      padding:12px 20px;
      background:#ff004f;
      border:none;
      border-radius:25px;
      color:white;
      font-weight:bold;
      cursor:pointer;
      margin:8px;
      font-size:16px;
      width:80%;
      max-width:300px;
    }
    #result { margin-top:10px; font-size:14px; }

    /* Bottom nav */
    nav {
      position:fixed;
      bottom:0; left:0;
      width:100%;
      background:#222;
      display:flex;
      justify-content:space-around;
      padding:10px 0;
      font-size:14px;
    }
    nav div { color:white; }

    /* Winning highlight */
    .win {
      animation: glow 1s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 10px gold; }
      to   { box-shadow: 0 0 25px orange; }
    }
  </style>
</head>
<body>
  <h1>♠ Super Ace ♠</h1>

  <!-- Multipliers -->
  <div class="multipliers">
    <div>x1</div><div>x2</div><div>x3</div><div>x5</div>
  </div>

  <!-- Balance + Bet -->
  <div id="balance">Balance: 1000</div>
  <div id="bet">Bet: 10</div>

  <!-- Reel grid -->
  <div class="grid" id="grid"></div>

  <!-- Controls -->
  <div class="controls">
    <button onclick="spin()">SPIN</button>
    <button onclick="autoSpin()">AUTOSPIN</button>
    <button onclick="increaseBet()">Increase Bet</button>
    <button onclick="decreaseBet()">Decrease Bet</button>
    <button onclick="goBack()">⬅ Back to Dashboard</button>
    <p id="result"></p>
  </div>

  <!-- Bottom nav -->
  <nav>
    <div>Menu</div>
    <div>Home</div>
    <div>Wallet</div>
    <div>Promo</div>
    <div>My Account</div>
  </nav>

  <!-- Sounds -->
  <audio id="winSound" src="win.mp3" preload="auto"></audio>
  <audio id="scatterSound" src="scatter.mp3" preload="auto"></audio>

  <script>
    const symbols = [
      {name:"A", img:"IMG_5471.png"},
      {name:"K", img:"king.png"},
      {name:"Q", img:"queen.png"},
      {name:"J", img:"jack.png"},
      {name:"10", img:"ten.png"},
      {name:"Scatter", img:"scatter.png"}
    ];

    let autoSpinActive = false;
    let balance = 1000;
    let bet = 10;

    function initGrid(){
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for(let i=0;i<15;i++){
        let cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<img src="${symbols[0].img}" alt="${symbols[0].name}">`;
        grid.appendChild(cell);
      }
    }

    function spin(){
      if(balance < bet){
        document.getElementById("result").innerText = "Not enough balance!";
        return;
      }
      balance -= bet;
      updateBalance();

      const grid = document.getElementById("grid").children;
      let scatterCount = 0;
      let aceCount = 0;
      let winningCells = [];

      for(let i=0;i<grid.length;i++){
        let sym = symbols[Math.floor(Math.random()*symbols.length)];
        grid[i].innerHTML = `<img src="${sym.img}" alt="${sym.name}">`;
        grid[i].classList.remove("win");
        if(sym.name === "Scatter"){ scatterCount++; winningCells.push(grid[i]); }
        if(sym.name === "A"){ aceCount++; winningCells.push(grid[i]); }
      }

      if(scatterCount >= 3){
        let win = bet * 5;
        balance += win;
        document.getElementById("result").innerText = "✨ Scatter Bonus! You won " + win + "!";
        highlightWin(winningCells);
        document.getElementById("scatterSound").play();
      } else if(aceCount >= 5){
        let win = bet * 10;
        balance += win;
        document.getElementById("result").innerText = "🎉 JACKPOT! You won " + win + "!";
        highlightWin(winningCells);
        document.getElementById("winSound").play();
      } else {
        document.getElementById("result").innerText = "Try again!";
      }
      updateBalance();

      if(autoSpinActive){
        setTimeout(spin, 1500);
      }
    }

    function autoSpin(){
      autoSpinActive = !autoSpinActive;
      if(autoSpinActive){
        spin();
      }
    }

    function increaseBet(){
      bet += 10;
      updateBet();
    }

    function decreaseBet(){
      if(bet > 10) bet -= 10;
      updateBet();
    }

    function updateBalance(){
      document.getElementById("balance").innerText = "Balance: " + balance;
    }

    function updateBet(){
      document.getElementById("bet").innerText = "Bet: " + bet;
    }

    function goBack(){
      window.location.href = "dashboard.html";
    }

    function highlightWin(cells){
      cells.forEach(cell => cell.classList.add("win"));
      setTimeout(() => {
        cells.forEach(cell => cell.classList.remove("win"));
      }, 2000);
    }

    initGrid();
    updateBalance();
    updateBet();
  </script>
</body>
</html>
