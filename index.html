<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JiliMadness</title>
  <style>
    body { margin:0; font-family:Arial; background:#4b0082; color:white; text-align:center; }
    .signup-box { margin:50px auto; width:300px; padding:20px; background:rgba(255,255,255,0.1); border-radius:10px; }
    input, button { width:90%; padding:10px; margin:10px 0; border:none; border-radius:5px; }
    button { background:#ff004f; color:white; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
  <h1>JiliMadness</h1>
  <p>Play Anytime, Anywhere — Earn Points!</p>

  <div class="signup-box">
    <h2>Sign Up Now</h2>
    <input type="text" id="phone" placeholder="09XXXXXXXXX">
    <button type="button" id="signupBtn">Sign Up</button>
    <p><input type="checkbox"> I Agree To Terms & Privacy</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLAo7rx11yfA6GAdWoXhwrd3hedcZXuBc",
      authDomain: "jilimadness.firebaseapp.com",
      projectId: "jilimadness",
      storageBucket: "jilimadness.firebasestorage.app",
      messagingSenderId: "150215292013",
      appId: "1:150215292013:web:d840af710a67776b8bbb64",
      measurementId: "G-WCZ8NS8CVT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("signupBtn").addEventListener("click", async () => {
      let phone = document.getElementById("phone").value;

      if (!/^09\d{9}$/.test(phone)) {
        alert("Invalid PH number. Use 09XXXXXXXXX format.");
        return;
      }

      try {
        await addDoc(collection(db, "users"), { phone: phone, points: 0 });
        localStorage.setItem("userPhone", phone);
        window.location.href = "home.html";
      } catch (error) {
        console.error("Error saving data:", error);
        alert("Error saving data. Check console.");
      }
    });
  </script>
</body>
</html>
