<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuperAce Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .game-container {
      margin: 40px auto;
      width: 360px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      padding: 20px;
      position: relative;
    }

    .multipliers {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
      font-weight: bold;
      color: gold;
    }

    .grid-wrapper {
      position: relative;
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 80px);
      gap: 5px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6em;
      font-weight: bold;
      color: gold;
      transition: transform 0.3s ease;
    }

    .card.spin {
      transform: rotateY(360deg);
    }

    .card.scatter {
      color: orange;
      text-shadow: 0 0 10px yellow;
    }

    .card.wild {
      color: lime;
      text-shadow: 0 0 10px green;
    }

    .combo-message {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3em;
      font-weight: bold;
      color: yellow;
      text-shadow: 0 0 20px orange, 0 0 40px red;
      animation: pulse 1s infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .spin-btn, .turbo-btn {
      background: gold;
      color: black;
      border: none;
      border-radius: 50%;
      padding: 20px;
      font-size: 1.2em;
      cursor: pointer;
      box-shadow: 0 0 20px yellow;
    }

    .spin-btn:hover, .turbo-btn:hover {
      background: orange;
    }

    .stats {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .buy-bonus {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SuperAce Demo</h1>
  <div class="game-container">
    <div class="multipliers">×1 ×2 ×3 ×5</div>
    <div class="buy-bonus">BUY BONUS</div>

    <div class="grid-wrapper">
      <div class="grid" id="grid"></div>
      <div id="comboMessage" class="combo-message"></div>
    </div>

    <div class="controls">
      <button class="spin-btn" onclick="spin()">SPIN</button>
      <button class="turbo-btn" onclick="turboSpin()">TURBO</button>
    </div>

    <div class="stats">
      <p id="statsText">Bet: 2 | Balance: 2000 | Win: 0</p>
    </div>
  </div>

  <script>
    const symbols = ["A", "K", "Q", "J", "♠", "♥", "♦", "♣", "SCATTER", "WILD"];
    const grid = document.getElementById("grid");
    const comboMessage = document.getElementById("comboMessage");
    const statsText = document.getElementById("statsText");

    let balance = 2000;
    const bet = 2;

    function spin(useTurbo = false) {
      grid.innerHTML = "";
      comboMessage.textContent = "";

      let scatterHit = false;
      let wildHit = false;
      let comboCount = 1;
      let lastSymbol = null;
      let win = 0;

      for (let i = 0; i < 20; i++) {
        const symbol = symbols[Math.floor(Math.random() * symbols.length)];
        const card = document.createElement("div");
        card.className = "card";
        if (!useTurbo) card.classList.add("spin");
        card.textContent = symbol;

        if (symbol === "SCATTER") {
          card.classList.add("scatter");
          scatterHit = true;
        }
        if (symbol === "WILD") {
          card.classList.add("wild");
          wildHit = true;
        }

        // Simple combo check
        if (symbol === lastSymbol) {
          comboCount++;
          card.style.color = "yellow";
          card.style.textShadow = "0 0 10px orange";
        } else {
          comboCount = 1;
        }
        lastSymbol = symbol;

        grid.appendChild(card);
      }

      // Calculate win
      if (scatterHit) win += 10;
      if (wildHit) win += 5;
      if (comboCount >= 3) win += comboCount * 2;

      balance = balance - bet + win;

      // Show overlay message (disappears after 2s)
      if (scatterHit) {
        comboMessage.textContent = "BONUS!";
        setTimeout(() => comboMessage.textContent = "", 2000);
      } else if (wildHit) {
        comboMessage.textContent = "WILD HIT!";
        setTimeout(() => comboMessage.textContent = "", 2000);
      } else if (comboCount >= 3) {
        comboMessage.textContent = "COMBO " + comboCount + "!";
        setTimeout(() => comboMessage.textContent = "", 2000);
      }

      // Update stats
      statsText.textContent = `Bet: ${bet} | Balance: ${balance} | Win: ${win}`;
    }

    function turboSpin() {
      spin(true); // run spin without animation
    }

    spin(); // initial load
  </script>
</body>
</html>
