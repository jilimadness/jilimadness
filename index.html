<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JiliMadness</title>
  <style>
    body {
      margin:0;
      font-family:Arial, sans-serif;
      background-image: url("IMG_5457.png"); /* violet background */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color:white;
      text-align:center;
    }
    .box {
      margin:50px auto;
      width:300px;
      padding:20px;
      background:rgba(0,0,0,0.6);
      border-radius:10px;
    }
    input, button {
      width:90%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:5px;
    }
    button {
      background:#ff004f;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <h1>JiliMadness</h1>
  <p>Play Anytime, Anywhere — Earn Points!</p>

  <div class="box">
    <h2>Sign Up / Login</h2>
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    // ✅ Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBLAo7rx11yfA6GAdWoXhwrd3hedcZXuBc",
      authDomain: "jilimadness.firebaseapp.com",
      projectId: "jilimadness",
      storageBucket: "jilimadness.firebasestorage.app",
      messagingSenderId: "150215292013",
      appId: "1:150215292013:web:d840af710a67776b8bbb64",
      measurementId: "G-WCZ8NS8CVT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function formatUsername(username) {
      return username + "@jilimadness.local"; // fake domain
    }

    window.signup = function() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, formatUsername(username), password)
        .then((userCredential) => {
          alert("Account created successfully!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Error: " + error.message);
        });
    }

    window.login = function() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, formatUsername(username), password)
        .then((userCredential) => {
          alert("Login successful!");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Error: " + error.message);
        });
    }
  </script>
</body>
</html>
