<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Ace Slot</title>
<style>
  body {
    background: radial-gradient(circle, #111 40%, #000);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    color: gold;
    font-family: Arial, sans-serif;
  }

  .multipliers {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: bold;
  }
  .active {
    color: #ffdf00;
    text-shadow: 0 0 10px gold;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 100px);
    grid-template-rows: repeat(3, 140px);
    gap: 2px;
    justify-content: center;
  }
  .cell {
    border: 2px solid gold;
    border-radius: 6px;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .cell img {
    width: 100%;
    height: auto;
    transform: translateY(-200%);
    transition: transform 0.6s ease-out;
  }

  #bonus {
    margin-top: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #ffdf00;
    text-shadow: 0 0 15px red;
    display: none;
  }

  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    background: gold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="multipliers">
    <span id="x1" class="active">x1</span>
    <span id="x2">x2</span>
    <span id="x3">x3</span>
    <span id="x5">x5</span>
  </div>

  <div class="grid" id="slotGrid">
    <!-- 15 empty cells -->
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
    <div class="cell"><img src="" alt=""></div>
  </div>

  <button id="spin">SPIN</button>
  <div id="bonus">BONUS ROUND!</div>

<script>
const cards = [
  "ace.png", "king.png", "queen.png", "jack.png", "ten.png",
  "heart.png", "spade.png", "diamond.png", "club.png", "scatter.png"
];
const cells = document.querySelectorAll('.cell img');
const multipliers = ["x1", "x2", "x3", "x5"];
let currentMultiplier = 0;
let freeSpins = 0;

function spinGrid() {
  let scatterCount = 0;

  cells.forEach((img, i) => {
    img.style.transform = 'translateY(-200%)';
    setTimeout(() => {
      const randomCard = cards[Math.floor(Math.random() * cards.length)];
      img.src = randomCard;
      img.alt = randomCard.replace(".png", "");
      img.style.transform = 'translateY(0)';

      if (randomCard === "scatter.png") {
        scatterCount++;
      }

      // After last cell finishes
      if (i === cells.length - 1) {
        if (scatterCount >= 3) {
          document.getElementById("bonus").style.display = "block";
          freeSpins = 5; // give 5 free spins
          runFreeSpins();
        } else {
          document.getElementById("bonus").style.display = "none";
        }
      }
    }, 300 + i * 50);
  });

  // Animate multiplier
  document.querySelectorAll('.multipliers span').forEach(el => el.classList.remove('active'));
  currentMultiplier = (currentMultiplier + 1) % multipliers.length;
  document.getElementById(multipliers[currentMultiplier]).classList.add('active');
}

function runFreeSpins() {
  if (freeSpins > 0) {
    freeSpins--;
    setTimeout(() => {
      spinGrid();
      runFreeSpins();
    }, 1500); // delay between auto spins
  }
}

document.getElementById('spin').addEventListener('click', spinGrid);

// Fill grid initially
spinGrid();
</script>
</body>
</html>
